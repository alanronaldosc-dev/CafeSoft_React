name: CI – Web React

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-lint-sonar:
    name: Build, Lint & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Lint (sin bloquear CI)
        run: npm run lint -- --max-warnings=9999 || true

      - name: Tests
        run: npm test || true

      - name: Build
        run: npm run build

      - name: Análisis SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=alanronaldosc-dev_CafeSoft_React
            -Dsonar.organization=alanronaldosc-dev
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**

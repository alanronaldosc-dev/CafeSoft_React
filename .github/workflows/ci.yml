name: CI - Web React

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-sonar:
    name: Build, Lint & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=9999 || true

      - name: Tests with coverage
        run: npm test

      - name: Production build
        run: npm run build

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=alanronaldosc-dev_CafeSoft_React
            -Dsonar.organization=alanronaldosc-dev
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.test.*
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
